spring:

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT}
      lettuce:
        pool:
          max-active: ${REDIS_MAX_POOL}

  # 데이터베이스 연결 설정
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver       # 사용하는 데이터베이스 드라이버
    url: ${DATABASE_URL} # 데이터베이스 URL
    username: ${DATABASE_USERNAME}                               # 데이터베이스 유저 이름
    password: ${DATABASE_PASSWORD}                                 # 데이터베이스 유저의 비밀번호
  # 스프링 JPA 설정
  jpa:
    hibernate:
      ddl-auto: update                             # DB 테이블 생성 전략 설정
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect # MySQL 8.x용 Dialect
        format_sql: true                             # 쿼리 로그를 정렬해서 출력한다
        show_sql: true                               # 실행되는 SQL 쿼리를 콘솔에 출력한다. 프로덕션 환경에서는 false로 변경해야 함.
    defer-datasource-initialization: true            # SQL 스크립트 초기화를 JPA 앤티티 매니저 초기화 이후로 지연시킨다. 이는 data.sql이 있어서 필요하다.
  sql:
    init:
      mode: always                                    # SQL 초기화 스크립트를 언제 실행할지 결정한다.

management:
  endpoints:
    web:
      exposure:
        include: health, metrics
  endpoint:
    health:
      show-details: always # 서킷 브레이커 상세 상태를 보기 위해 필수!
  health:
    circuitbreakers:
      enabled: true

resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED

        # 1. 윈도우 사이즈와 최소 평가 횟수 스케일업 (민감도 낮추기)
        slidingWindowSize: 100                  # 최근 100번의 호출을 기준으로 평가
        minimumNumberOfCalls: 30                # 최소 30번은 호출되어야 실패율 계산 시작

        # 2. 실패율 및 지연(Slow Call) 차단 기준
        failureRateThreshold: 50                # 실패율 50% 이상 시 OPEN
        slowCallDurationThreshold: 2500ms       # 2.5초 이상 걸리면 '느린 호출'로 간주
        slowCallRateThreshold: 50               # 느린 호출이 50% 이상이어도 OPEN (스레드 고갈 방지)

        # 3. 복구 대기 시간 조정
        waitDurationInOpenState: 15s            # OPEN 후 15초 대기 (빠른 복구 시도)
        permittedNumberOfCallsInHalfOpenState: 5 # HALF_OPEN 상태에서 5번 찔러보기

        # 4. 예외 기록 및 무시 (중요!)
        recordExceptions:
          - java.util.concurrent.TimeoutException
          - java.io.IOException
          - org.springframework.web.reactive.function.client.WebClientRequestException
          - com.serverbe.domain.exception.external.ExternalApiException # (5xx 에러 전용)
        ignoreExceptions:
          #- com.serverbe.domain.exception.external.ExternalApiClientException # (4xx 에러 전용)

    instances:
      # 로그인과 지오코딩의 트래픽(TPS)이 다르다면 base-config를 분리하는 것도 좋습니다.
      kakaoUserInfoApi:
        base-config: default
      kakaoTokenApi:
        base-config: default
      googleUserInfoApi:
        base-config: default
      googleTokenApi:
        base-config: default
      kakaoGeocodeApi:
        base-config: default
        # 지오코딩은 트래픽이 더 많을 수 있으므로 윈도우 사이즈를 늘리는 오버라이딩 가능
        # slidingWindowSize: 200

# Swagger 사용 설정
springdoc:
  swagger-ui:
    path: /swagger-ui.html                      # 스웨거 접근 경로
  api-docs:
    path: /v3/api-docs                          # openAPI 접근 경로
  show-actuator: true                           # Spring Actuator의 endpoint까지 보여줄 것인지?
  default-consumes-media-type: application/json # request media type 의 기본 값
  default-produces-media-type: application/json # response media type 의 기본 값
  paths-to-match: # 해당 패턴에 매칭되는 controller만 swagger-ui에 노출한다.
    - /api/v1/**

# ===================================================================
# JWT (JSON Web Token) 관련 설정
# JWTProperties.java 레코드에 바인딩됩니다.
# ===================================================================
# JWT 토큰 설정
jwt:
  secret: ${JWT_SECRET}                    # HS512 알고리즘을 사용할 것이기 때문에 512bit, 즉 64byte 이상의 secret key를 사용해야 한다.
  access-token:
    prefix: "Bearer "
    header: Authorization                  # 액세스 토큰 헤더
    validity-in-minute: 15m                # 액세스 토큰 유효기간 (시간)
  refresh-token:
    cookie: ${JWT_REFRESH_TOKEN_COOKIE}    # 리프레시 토큰 쿠키 키
    expiration-days: 60d                   # 리프레시 토큰 유효기간 (일)
    byte-length: 64
  allowed-clock-skew-seconds: 30
  id-key: id                               # 액세스 토큰에서 사용자 식별자를 가져올 키
  role-key: roles                          # 액세스 토큰에서 권한을 가져올 키

# Redis
redis:
  keys:
    running-art-geo: running_art:locations
  port: ${REDIS_PORT}
  host: ${REDIS_HOST}
  auth:
    prefix: user                      # 레디스 저장에 필요한 키 값 중 접두어
    suffix: rt                        # 레디스 저장에 필요한 키 값 중 접미어
    max-token: 3                      # 최대로 발급 가능한 토큰의 수
  session:
    suffix: session
  blacklist:
    access-token-prefix: "BL:AT"
    refresh-token-prefix: "BL:RT"

kakao:
  admin-key: ${KAKAO_ADMIN_KEY}
  client-id: ${KAKAO_CLIENT_ID}
  auth:
    redirect-uri: ${KAKAO_REDIRECT_URI}
    kauth: https://kauth.kakao.com
    kapi: https://kapi.kakao.com
    connect-timeout-millis: 5000
    response-timeout-seconds: 5
    time-out-seconds: 5
  geocoding:
    dapi: https://dapi.kakao.com
    geocode-api: /v2/local/search/address.json

google:
  auth:
    client-id: ${GOOGLE_CLIENT_ID}                                  # 구글 클라우드 콘솔에서 발급받은 클라이언트 ID
    client-secret: ${GOOGLE_CLIENT_SECRET}                          # 구글 클라우드 콘솔에서 발급받은 클라이언트 보안 비밀번호
    redirect-uri: http://localhost:8080/api/v1/auth/callback/google # AuthController의 callback 엔드포인트와 일치해야 함
    oauth-api: https://oauth2.googleapis.com                         # 토큰 발급 및 인증 관련 API 주소
    api: https://www.googleapis.com                                 # 유저 정보 조회 관련 API 주소



# 암호화
encryption:
  algorithm: ${ENCRYPTION_ALGORITHM}
  tag-length-bit: 128
  iv-length-byte: 12
  key-algorithm: AES
  active-version: v2
  keys:
    v1: ${ENCRYPTION_SECRET_KEY_V1} # 기존 키
    v2: ${ENCRYPTION_SECRET_KEY_V2} # 새로 발급할 키

# CORS
cors:
  allowed-origins:
    - ${FRONTEND_DOMAIN}          # 프론트엔드 로컬 개발 환경
    - ${DEVELOP_SERVER_DOMAIN}    # 개발 서버 도메인
    - ${PROD_SERVER_DOMAIN}   # 운영 서버 도메인

rate-limit:
  user:
    capacity: ${RATE_LIMIT_USER_CAPACITY} # 사용자가 한 번에 모아둘 수 있는 최대 토큰 개수 - 사용자가 잠시 쉬었다가 요청을 보낼 때, 순간적으로(Burst) 최대 10개까지는 연속 허용
    refill-rate: ${RATE_LIMIT_USER_REFILL_RATE} # 1초마다 채워지는 토큰의 속도입니다. - 장기적으로는 초당 평균 10회의 요청을 처리할 수 있다.
  ip:
    capacity: ${RATE_LIMIT_IP_CAPACITY}
    refill-rate: ${RATE_LIMIT_IP_REFILL_RATE}
  prefix:
    user: "rate:user:"
    ip: "rate:ip:"

# 알림 설정
notification:
  discord:
    webhook-url: ${DISCORD_WEB_HOOK}